[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landmine"
version = "0.1.0a1"
description = "Trace hidden code-change risks through local Git evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jaeuk Han"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.20",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
landmine = "landmine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["security_release: prerelease security regression gate"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".test-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
