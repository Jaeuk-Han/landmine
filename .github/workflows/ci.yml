name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  quality:
    name: lint, format, and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: git diff --check

  release-package:
    name: release package and security gate
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]" build
      - name: Security release gate
        run: python -m pytest tests/release/test_security_gate.py
      - name: Build sdist and wheel
        run: python -m build
      - name: Inspect archive contents
        run: python tools/inspect_artifacts.py dist
      - name: Fresh wheel install and installed CLI smoke
        run: python tools/fresh_install_smoke.py --dist dist --schema schemas/result-v1.schema.json
      - name: Reject indexed local and build artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.test-tmp[^/]*|dist|build|\.venv|venv|\.release-venv)(/|$)'; then
            echo "release/test artifact is tracked"
            exit 1
          fi
